version: '3.8'

services:
  web:
    build: .
    ports:
      - '5000:5000'
    environment:
      - MONGODB_URL=mongodb://mongo_admin:password@mongo:27017
    depends_on:
      - mongo
    volumes:
      - .:/app
    networks:
      - library-network

  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo_admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - library-network

volumes:
  mongo_data:

networks:
  library-network:
    driver: bridge
